# Extra Travel Point - Production Docker Compose
# Usage: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  etp-postgres:
    image: postgres:15-alpine
    container_name: etp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-etp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-etp_password_2026}
      POSTGRES_DB: ${DB_NAME:-etp_db}
    volumes:
      - etp_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-etp_user} -d ${DB_NAME:-etp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  etp-redis:
    image: redis:7-alpine
    container_name: etp-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-etp_redis_pass}
    volumes:
      - etp_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-etp_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etp-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: etp-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-etp_user}:${DB_PASSWORD:-etp_password_2026}@etp-postgres:5432/${DB_NAME:-etp_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-etp_redis_pass}@etp-redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "5000:5000"
    depends_on:
      etp-postgres:
        condition: service_healthy
      etp-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  etp_postgres_data:
  etp_redis_data:
